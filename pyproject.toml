[project]
name = "netfix"
version = "0.1.0"
description = "Network diagnostic and repair tool for macOS with VPN awareness"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.scripts]
netfix = "netfix.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/netfix"]
